name: XAUUSD Daily Momentum Report

on:
  schedule:
    # 平日（月〜金）の日本時間 9:00〜15:00（UTC 0:00〜6:00）の毎時0分に自動実行
    - cron: '0 0-6 * * 1-5'

  workflow_dispatch: # 手動実行用ボタン（いつでも手動テスト可能）

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - run: |
          pip install -r requirements.txt
          python xauusd_momentum_agent.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
