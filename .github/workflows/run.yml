name: Hourly Stock Agent

on:
  schedule:
    # 平日（月〜金）の日本時間 9:00〜15:00（UTC 0:00〜6:00）の毎時0分に自動実行
    - cron: '0 0-6 * * 1-5'
  workflow_dispatch: # 手動で今すぐ実行できるボタン

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas numpy matplotlib requests google-generativeai tabulate
      - name: Run Script
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python stock_agent.py
