name: Hourly Stock Agent

on:
  schedule:
    # 平日（月〜金）の日本時間 12:00（UTC 3:00）に1回のみ自動実行
    - cron: '0 3 * * 1-5'
  workflow_dispatch: # 手動実行用ボタン（いつでも手動テスト可能）

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy matplotlib requests tabulate
      - name: Run Stock Agent Script
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python stock_agent.py
