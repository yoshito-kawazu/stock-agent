name: Weekly Stock Analysis Reporter

on:
  schedule:
    # 毎週金曜日 JST 17:00 (UTC 08:00) に定期実行
    - cron: '0 8 * * 5'
  workflow_dispatch: # Actionsタブから手動実行可能にする設定

jobs:
  analyze-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Web検索と詳細レポート生成に数分かかるため長めに確保

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 分析スクリプトの実行とDiscord通知
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python analyze_stocks.py
